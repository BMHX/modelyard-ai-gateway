services:
  postgres:
    image: postgres:16-alpine
    container_name: teamops-postgres
    environment:
      POSTGRES_DB: teamops
      POSTGRES_USER: teamops
      POSTGRES_PASSWORD: teamops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    container_name: teamops-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

volumes:
  postgres-data:
  valkey-data:
